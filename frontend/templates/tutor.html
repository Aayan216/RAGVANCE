{% extends "base.html" %}
{% block title %}Tutor - RAGVANCE{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-chat-dots"></i> AI Tutor</h4>
                <button type="button" id="clearChatBtn" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-trash me-1"></i>Clear
                </button>
            </div>
            <div class="card-body p-0">
                <div id="chatContainer" class="chat-container" style="height: 500px; overflow-y: auto; padding: 1rem;">
                    <div id="welcomeMessage" class="message assistant-message mb-3">
                        <div class="message-bubble assistant-bubble p-3 rounded">
                            <strong>AI Tutor:</strong> Hello! I'm your AI study assistant. Ask me anything about your uploaded study materials.
                        </div>
                    </div>
                </div>
                <div class="card-footer p-3">
                    <form id="questionForm" class="d-flex gap-2">
                        {% csrf_token %}
                        <input type="text" id="questionInput" class="form-control flex-grow-1" 
                               placeholder="Ask a question about your study materials..." autocomplete="off">
                        <button type="submit" id="askBtn" class="btn btn-primary">
                            <i class="bi bi-send"></i>
                        </button>
                    </form>
                    <div id="loading" class="text-center text-muted small mt-2 d-none">
                        <span class="spinner-border spinner-border-sm"></span> Thinking...
                    </div>
                </div>
            </div>
    </div>
</div>

<!-- Source Context Modal -->
<div class="modal fade" id="sourceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="sourceModalTitle">Source Context</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="sourceModalMeta" class="text-muted small mb-2"></p>
                <div id="sourceModalText" class="p-3 rounded" style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; background: var(--color-neutral-100);"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const TUTOR_STATE_KEY = 'ragvance-tutor-state';
const TUTOR_STATE_VERSION = 1;
let chatMessages = [];

function pageSuffix(src, sep) {
    const isTxt = String(src.file_name || '').toLowerCase().endsWith('.txt');
    return (!isTxt && src.page_number) ? `${sep}${src.page_number}` : '';
}

function saveTutorState() {
    try {
        localStorage.setItem(TUTOR_STATE_KEY, JSON.stringify({ version: TUTOR_STATE_VERSION, messages: chatMessages }));
    } catch (err) {}
}

function loadTutorState() {
    try {
        const raw = localStorage.getItem(TUTOR_STATE_KEY);
        if (!raw) return null;
        const state = JSON.parse(raw);
        if (!state || state.version !== TUTOR_STATE_VERSION || !Array.isArray(state.messages)) return null;
        const valid = state.messages.every(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string');
        return valid ? state : null;
    } catch (err) {
        return null;
    }
}

function clearTutorState() {
    try {
        localStorage.removeItem(TUTOR_STATE_KEY);
    } catch (err) {}
}

document.getElementById('questionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    if (!question) return;
    
    addMessage(question, 'user');
    input.value = '';
    
    document.getElementById('loading').classList.remove('d-none');
    document.getElementById('askBtn').disabled = true;
    
    try {
        const response = await fetch('{% url "tutor_ask" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
            },
            body: JSON.stringify({ question })
        });
        
        const data = await response.json();
        
        if (data.error) {
            addMessage('Error: ' + data.error, 'assistant', true);
        } else {
            addMessage(data.answer, 'assistant', false, data.sources);
            chatMessages.push({ role: 'user', content: question });
            chatMessages.push({ role: 'assistant', content: data.answer, sources: data.sources || [] });
            saveTutorState();
        }
    } catch (err) {
        addMessage('Error: ' + err.message, 'assistant', true);
    } finally {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('askBtn').disabled = false;
        input.focus();
    }
});

function addMessage(text, sender, isError = false, sources = []) {
    const container = document.getElementById('chatContainer');
    const div = document.createElement('div');
    div.className = `message ${sender}-message mb-3`;
    
    let html = `<div class="message-bubble ${sender === 'user' ? 'bg-primary text-white ms-auto' : 'assistant-bubble'} p-3 rounded" style="max-width: 85%;">`;
    if (sender === 'assistant') {
        html += '<strong>AI Tutor:</strong> ';
    }
    html += isError ? `<span class="text-danger">${text}</span>` : text;

    if (sources.length > 0) {
        const srcId = 'sources-' + Date.now();
        html += `<div class="mt-2"><button class="btn btn-sm btn-outline-secondary toggle-sources" data-target="${srcId}">
            <i class="bi bi-eye"></i> Show Sources (${sources.length})
        </button></div>`;
        html += `<div id="${srcId}" class="sources mt-2 d-none">`;
        sources.forEach((src, i) => {
            html += `<div class="source-item small py-1">
                <strong>${src.file_name}${pageSuffix(src, ' · Page ')}</strong> - Score: ${src.score?.toFixed(3)}
                <button class="btn btn-sm btn-link p-0 ms-1 show-source" data-index="${i}">Show</button>
            </div>`;
        });
        html += '</div>';
    }
    
    html += '</div>';
    div.innerHTML = html;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    
    div.querySelectorAll('.show-source').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const idx = e.target.dataset.index;
            const src = sources[idx];
            document.getElementById('sourceModalTitle').textContent = `Source: ${src.file_name}`;
            document.getElementById('sourceModalMeta').textContent = `Document: ${src.file_name}${pageSuffix(src, ' | Page: ')} | Chunk: ${src.chunk_index} | Score: ${src.score?.toFixed(3)}`;
            document.getElementById('sourceModalText').textContent = src.text;
            new bootstrap.Modal(document.getElementById('sourceModal')).show();
        });
    });

    div.querySelectorAll('.toggle-sources').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const target = document.getElementById(e.currentTarget.dataset.target);
            const isHidden = target.classList.contains('d-none');
            target.classList.toggle('d-none');
            e.currentTarget.innerHTML = isHidden
                ? '<i class="bi bi-eye-slash"></i> Hide Sources'
                : `<i class="bi bi-eye"></i> Show Sources (${sources.length})`;
        });
    });
}

const welcomeMessage = document.getElementById('welcomeMessage');
const savedTutorState = loadTutorState();
if (savedTutorState && savedTutorState.messages.length > 0) {
    chatMessages = savedTutorState.messages;
    welcomeMessage.style.display = 'none';
    chatMessages.forEach(m => addMessage(m.content, m.role, false, m.sources || []));
}

document.getElementById('clearChatBtn').addEventListener('click', () => {
    const container = document.getElementById('chatContainer');
    container.querySelectorAll('.message').forEach(el => {
        if (el !== welcomeMessage) el.remove();
    });
    welcomeMessage.style.display = '';
    chatMessages = [];
    clearTutorState();
    container.scrollTop = 0;
    document.getElementById('questionInput').focus();
});
</script>
{% endblock %}
