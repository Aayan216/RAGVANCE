{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RAGVANCE{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/FullLogo_Transparent_NoBuffer.png' %}">
    <script>
        (function () {
            var theme = 'light';
            try {
                if (localStorage.getItem('ragvance-theme') === 'dark') {
                    theme = 'dark';
                }
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'upload' %}">
                <img src="{% static 'images/FullLogo_Transparent_NoBuffer.png' %}" alt="RAGVANCE" class="navbar-logo">
            </a>
            <div class="navbar-nav ms-auto align-items-center">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <i class="bi bi-moon-stars" id="themeIcon"></i>
                </button>
                <a class="nav-link" href="{% url 'upload' %}"><i class="bi bi-upload"></i> Upload</a>
                <a class="nav-link" href="{% url 'tutor' %}"><i class="bi bi-chat-dots"></i> Tutor</a>
                <a class="nav-link" href="{% url 'practice' %}"><i class="bi bi-question-circle"></i> Practice</a>
                <a class="nav-link" href="{% url 'mock_test_settings' %}"><i class="bi bi-stopwatch"></i> Mock Test</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% if messages %}
            <div class="messages mb-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 border-top">
        <div>
            <div style="font-size: 1rem; font-weight: 600;">RAGVANCE</div>
            <div style="font-size: 0.5rem; letter-spacing: 0.15em; opacity: 0.5;">BY TESSERACT</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
